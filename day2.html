<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome css</title>
    <style>
        body{ 
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

           
        }
        .login-box{
            background-color: white;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 300px;
            
        }
        input[type="text"],
        input[type="password"]{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input[type="submit"]{
            width: 100px;
            padding: 10px;
            background-color: rgb(43, 5, 15);
            color: rgb(224, 106, 76);
            border: none;
            cursor: pointer;
        }
        input[type="submit"]{
            background-color: color(from color srgb r g b);
        }
    </style>
</head>
<body>
     <div class="login-box">
        <h2>Login</h2>

        <form>
            <label>Username:</label><br>
            <input type="text" placeholder="Enter Username">

            <label>Password:</label><br>
            <input type="password" placeholder="Enter Password">

            <input type="submit" placeholder="Login">
        </form>
    </div>
    
</body>
</html>
